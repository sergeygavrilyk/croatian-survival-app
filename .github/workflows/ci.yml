# Автоматичні перевірки після кожного push і pull request (docs/TESTING.md §4).
# Збірка й тести без входу — з підставними адресами Supabase, SQL-тести — на чистій локальній Postgres у GitHub
# (scripts/dev/curdb.sh), без доступу до робочої бази. E2E з тестовим акаунтом (робота e2e-user, рішення власника
# 2026-11-14) — з репозиторних секретів E2E_EMAIL, E2E_PASSWORD, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY;
# немає секретів (ще не додано або PR із форку) — робота пропускає кроки й лишається зеленою.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Підставні значення: справжня база в CI не потрібна (і не використовується)
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  app:
    name: Lint, типи, unit-тести, збірка, E2E без входу
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit-тести
        run: npm test
      # Збірка створює next-env.d.ts і .next/types — тому типи перевіряємо після неї
      - name: Збірка
        run: npm run build
      - name: Типи
        run: npm run typecheck
      # Сам браузер — з CDN Playwright. Системні бібліотеки на ubuntu-24.04 уже є (бракує лише необов'язкових шрифтів),
      # тож збій дзеркал Ubuntu (apt) не блокує E2E: install-deps — не довше 5 хв, помилка — лише попередження.
      - name: Браузер для E2E
        run: |
          npx playwright install chromium
          timeout --kill-after=15 300 npx playwright install-deps chromium \
            || echo "::warning::Системні пакети для Playwright не встановились (дзеркала Ubuntu?) — E2E запускаємо з тим, що є на сервері"
      - name: E2E без входу (smoke)
        run: npm run e2e:smoke
      - name: Звіт E2E (якщо впало)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  sql:
    name: SQL-тести (локальна Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-16
          fi
      - name: Локальна база (міграції + пакети контенту)
        run: sudo bash scripts/dev/curdb.sh
      - name: SQL-тести
        run: bash scripts/dev/sqltests.sh

  e2e-user:
    name: E2E з тестовим акаунтом
    needs: app
    # Лише PR, ручний запуск і main: push у гілку з відкритим PR інакше запускав би ті самі сценарії двічі
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Один тестовий акаунт — запуски по черзі, не паралельно
    concurrency:
      group: e2e-test-account
      cancel-in-progress: false
    env:
      # Справжні адреси Supabase (перекривають підставні вище): NEXT_PUBLIC_* вшиваються в збірку
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Чи є секрети тестового акаунта
        id: secrets
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E з входом пропущено: немає репозиторних секретів E2E_EMAIL / E2E_PASSWORD / NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY (docs/TESTING.md §3)"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
      - name: Збірка з адресою робочої бази
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - name: Браузер для E2E
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npx playwright install chromium
          timeout --kill-after=15 300 npx playwright install-deps chromium \
            || echo "::warning::Системні пакети для Playwright не встановились (дзеркала Ubuntu?) — E2E запускаємо з тим, що є на сервері"
      # Пишуть у робочу базу лише прогрес і події тестового акаунта (як npm run e2e у власника)
      - name: E2E з входом (setup + user)
        if: steps.secrets.outputs.ok == 'true'
        run: npx playwright test --project=setup --project=user
      # Звіт Playwright тут не вивантажуємо: запис кроків (trace) містить пароль тестового акаунта, а репозиторій публічний.
      # Що впало — видно в лозі кроку; повний звіт — локально: npm run e2e і npx playwright show-report.
